AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 bucket managed by CloudFormation for Chapter 9

Resources:
  SimpleAWSBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: SimpleAWS
        - Key: Chapter
          Value: Chapter9

Outputs:
  BucketName:
    Description: Name of the S3 bucket created by this stack
    Value: !Ref SimpleAWSBucket
  BucketArn:
    Description: ARN of the S3 bucket created by this stack
    Value: !GetAtt SimpleAWSBucket.Arn
