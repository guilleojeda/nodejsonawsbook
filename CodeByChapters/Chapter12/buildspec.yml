version: 0.2

env:
  secrets-manager:
    DOCKERHUB_USERNAME: "DockerHubCredentials:username"
    DOCKERHUB_PASSWORD: "DockerHubCredentials:password"

phases:
  pre_build:
    commands:
      - echo Logging in to Docker Hub...
      - >-
        echo "$DOCKERHUB_PASSWORD" | docker login
        --username "$DOCKERHUB_USERNAME" --password-stdin
      - echo Logging in to Amazon ECR...
      - aws --version
      - ECR_HOST="dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - REGISTRY="$AWS_ACCOUNT_ID.$ECR_HOST"
      - >-
        aws ecr get-login-password
        --region "$AWS_DEFAULT_REGION" |
        docker login --username AWS --password-stdin
        "$REGISTRY"
      - REPOSITORY_URI="$REGISTRY/$ECR_REPOSITORY"
      - IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - >-
        docker build --platform=linux/amd64
        -t "$REPOSITORY_URI:$IMAGE_TAG" .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"


      - echo Writing image definitions file...
      - >-
        printf '[{"name":"%s","imageUri":"%s"}]'
        "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" >
        imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
